  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #f6f2ea;
      color: #3b2317;
      font-family: Arial, sans-serif;
    }

    .guide-wrap {
      width: 100%;
      max-width: 1600px;
      margin: 0 auto;
      background: #fff;
    }

    .guide-image {
      width: 100%;
      display: block;
    }

    .top-btn {
      position: fixed;
      right: 28px;
      bottom: 28px;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #3b2317;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      transition: 0.25s ease;
      z-index: 999;
    }

    .top-btn:hover {
      transform: translateY(-4px);
      background: #8b6e59;
    }

    @media (max-width: 768px) {
      .top-btn {
        right: 18px;
        bottom: 18px;
        width: 44px;
        height: 44px;
        font-size: 15px;
      }
    }
  </style>
</head>
